<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;width:900px;background:#0d1627;padding:8px"><style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;box-shadow:none!important}
html,body{height:100%}
/* Six type steps, three families, three colours of text. Display 40 / Title 28 / Verdict 22
   (SIGNAL_CSS) / Body 14 / Data 13 / Label 11. Nothing renders under 11px. Capitals live in
   the label tier and on a name; verify_liquid.py lints both. Oxblood is a mark, never text.
   The Sept 6 design review is the source: claude/ironstack-design-review-2026-09-06.md. */
body{background:#171513;color:#ebe5d8;font-family:'Merriweather',Georgia,'Times New Roman',serif;font-size:14px;line-height:1.55;padding:14px 18px;overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2a2622}::-webkit-scrollbar-track{background:transparent}
/* Label 11. One per card. */
.eyebrow{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#8f8b84;white-space:nowrap}
.eyebrow.dim{color:#a8a094}
/* Display 40. Scales with the panel, so a phone-width card wraps rather than clips. */
.hero{font-family:'Oswald','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;font-size:clamp(30px,9vw,40px);font-weight:700;line-height:1;letter-spacing:-.015em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hero .u{font-size:16px;font-weight:500;color:#a8a094;margin-left:6px;letter-spacing:.02em}
/* Title 28. Page, lift and session names; the tile values. */
.title,.value{font-family:'Oswald','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;font-size:clamp(22px,6vw,28px);font-weight:600;line-height:1;letter-spacing:-.005em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.value small{font-size:13px;font-weight:500;color:#a8a094;letter-spacing:.04em;margin-left:5px;text-transform:none}
/* Data 13 and the scope line at 12. */
.sub{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#a8a094;line-height:1.6}
.faint{color:#8f8b84}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
/* Body 14. */
.prose{font-family:'Merriweather',Georgia,'Times New Roman',serif;font-size:14px;line-height:1.55;color:#a8a094}
.rule{border-top:1px solid #2a2622}
.stack{display:flex;flex-direction:column;justify-content:flex-start;gap:10px;height:100%}
.stack.spread{justify-content:space-between;gap:0}
.row{display:flex;gap:0;align-items:flex-start}
.card{flex:1;min-width:0;padding:0 18px;border-left:1px solid #2a2622;display:flex;flex-direction:column;justify-content:flex-start;gap:5px}
.card:first-child{padding-left:0;border-left:0}
.card .top{display:flex;flex-direction:column;gap:5px}
.chip{display:inline-block;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.04em;color:#a8a094;border:1px solid #2a2622;padding:1px 6px;margin:0 4px 2px 0;white-space:nowrap}
.chip.made{color:#ebe5d8;border-color:#8f8b84}
/* A miss keeps its strike in oxblood at twice the weight; the box border carries it too. */
.chip.miss{color:#8f8b84;border-color:#a8211a_DIM;text-decoration:line-through;text-decoration-color:#a8211a;text-decoration-thickness:2px}
/* A gain is marked by its border, not its text. */
.chip.blood{color:#ebe5d8;border-color:#a8211a}
.bar{height:2px;background:#2a2622;position:relative;margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#a8a094;display:block}
.bar.dim i{background:#a8a094}
.empty{color:#8f8b84;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid #2a2622;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px}
.item:first-child{border-top:0}
.item .when{color:#8f8b84;font-size:12px;min-width:72px}
.item .txt{color:#ebe5d8;flex:1;min-width:0}
.item .num{color:#a8a094;white-space:nowrap;font-variant-numeric:tabular-nums}
/* The set row: number, weight, x reps, @ RPE, note. Warm-ups are smaller, not fainter. */
.set{display:flex;align-items:baseline;gap:9px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;padding:4px 0;font-variant-numeric:tabular-nums}
.set .n{color:#8f8b84;font-size:11px;min-width:14px;font-weight:400}
.set .w{color:#ebe5d8;min-width:56px;text-align:right;font-size:15px;font-weight:600;letter-spacing:-.01em}
.set .x{color:#a8a094;font-size:12px}
.set .r{color:#ebe5d8;min-width:30px;font-size:13px}
.set .rpe{font-size:13px;letter-spacing:.02em}
.set .rpe.lo{color:#8f8b84}
.set .rpe.mid{color:#a8a094}
.set .rpe.hi{color:#ebe5d8;font-weight:600}
.set .rpe.max{color:#ebe5d8;font-weight:700}
.set .rpe.max::after{content:"";display:inline-block;width:6px;height:6px;background:#a8211a;margin-left:6px;vertical-align:middle}
.set .note{color:#8f8b84;font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set.prep .w{font-size:13px;font-weight:400;color:#8f8b84}
.set.prep .x,.set.prep .r{color:#8f8b84}
.ex{margin-bottom:14px}
.ex .name{font-family:'Oswald','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;padding-bottom:3px;border-bottom:1px solid #2a2622;margin-bottom:3px}
.ex .name .cat{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:#8f8b84;margin-left:8px;font-weight:500}
.cols{column-count:2;column-gap:36px}
.liftrow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid #2a2622}
.liftrow:first-child{border-top:0}
.lname{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a8a094;min-width:76px}
.lval{font-family:'Oswald','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;color:#ebe5d8;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.lbar{flex:1;min-width:24px;height:3px;background:#2a2622;position:relative}
.lbar i{position:absolute;left:0;top:0;bottom:0;background:#a8a094;display:block}
.lkg{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#8f8b84;min-width:62px;text-align:right}
.warm{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.9;color:#a8a094;margin-top:5px}
.warm .nm{color:#ebe5d8;text-transform:uppercase;letter-spacing:.04em;font-size:11px;margin-right:5px}
.warm .qty{color:#8f8b84;margin-right:7px}
.warm .sep{color:#8f8b84;margin-right:9px}
.cols .ex{break-inside:avoid}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px}
.k{color:#8f8b84}
.v{color:#ebe5d8}
.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hdr .meta{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#a8a094;letter-spacing:.02em}
.hdr .meta b{color:#ebe5d8;font-weight:500}
.dot{display:inline-block;width:7px;height:7px;background:#a8211a;margin:0 8px;vertical-align:middle}
svg{display:block}
</style>
<div class="row">
<div class="card"><div class="top"><div class="eyebrow">Meets</div><div class="value">3</div></div><div class="sub">in the page's range<br>best finish <span class="v">1st</span></div></div>
<div class="card"><div class="top"><div class="eyebrow">Best total</div><div class="value">412.5<small>kg</small></div></div><div class="sub">909&nbsp;lb</div></div>

<div class="card"><div class="top"><div class="eyebrow">Best DOTS</div><div class="value">269.6</div></div><div class="sub">across those meets</div></div>

<div class="card"><div class="top"><div class="eyebrow">Attempts made</div><div class="value">22<small>of 27</small></div></div><div class="sub">81% made in range</div></div>

</div></body></html>
