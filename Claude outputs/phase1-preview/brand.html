<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;width:1050px;background:#0d1627;padding:8px"><style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;box-shadow:none!important}
/* No height:100%, no flex. The panel iframe is not always the height Kibana
   implies, and any centring or space-between put the wordmark below the fold.
   Plain block flow starts at the top of the document and cannot be pushed down. */
body{background:#171513;color:#ebe5d8;font-family:'Oswald','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;padding:10px 18px;overflow:hidden;-webkit-font-smoothing:antialiased}
/* Label 11 in STEEL. Oxblood text is 2.5:1 on this ground; the square beside the wordmark is the mark. */
.eyebrow{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#8f8b84;margin-bottom:6px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.left{display:flex;align-items:baseline;gap:10px}
.word{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.sq{display:inline-block;width:11px;height:11px;background:#a8211a;transform:translateY(-1px)}
.vr{width:1px;height:22px;background:#2a2622;transform:translateY(4px);margin:0 6px}
.section{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#a8a094}
.tagline{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#a8a094;text-align:right;max-width:60%;line-height:1.55}
</style>
<div class="eyebrow">&#9646;&#9646;&#9646;&nbsp;&nbsp;A Mission Built training system&nbsp;&nbsp;&#9646;&#9646;&#9646;</div>
<div class="bar"><div class="left"><span class="word">Iron</span><span class="sq"></span><span class="word">Stack</span><span class="vr"></span><span class="section">OVERVIEW</span></div><div class="tagline">Heavy means heavy for you now. Intensity is measured against your best in the last 90 days, not an all-time max.</div></div></body></html>
